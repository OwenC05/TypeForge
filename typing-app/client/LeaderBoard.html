							<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeForge - Leaderboard</title>
    <meta name="description" content="Compete with typists worldwide. See where you stand on the TypeForge leaderboard and challenge your friends to beat your scores.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-teal': '#00ffff',
                        'pure-black': '#000000',
                        'dark-gray': '#1a1a1a',
                        'medium-gray': '#666666',
                        'light-gray': '#999999',
                        'card-bg': '#0f0f0f',
                        'card-hover': '#1f1f1f'
                    },
                    fontFamily: {
                        'mono': ['JetBrains Mono', 'Consolas', 'Monaco', 'monospace']
                    },
                    animation: {
                        'fade-in': 'fade-in 0.8s ease-out',
                        'fade-in-up': 'fade-in-up 0.6s ease-out',
                        'glow-pulse': 'glow-pulse 2s ease-in-out infinite alternate',
                        'particle-float': 'particle-float 8s ease-in-out infinite',
                        'card-hover': 'card-hover 0.3s ease-out',
                        'wpm-glow': 'wmp-glow 1.5s ease-in-out infinite alternate',
                        'challenge-slide': 'challenge-slide 0.3s ease-out',
                        'rank-pulse': 'rank-pulse 0.5s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes glow-pulse {
            from { box-shadow: 0 0 5px #00ffff; }
            to { box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff; }
        }
        
        @keyframes particle-float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100px) translateX(20px) rotate(360deg); opacity: 0; }
        }
        
        @keyframes card-hover {
            from { transform: scale(1) translateY(0); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
            to { transform: scale(1.02) translateY(-2px); box-shadow: 0 8px 25px rgba(0, 255, 255, 0.1); }
        }
        
        @keyframes wmp-glow {
            from { text-shadow: 0 0 5px #00ffff; }
            to { text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff; }
        }
        
        @keyframes challenge-slide {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes rank-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .gradient-bg {
            background: linear-gradient(180deg, #000000 0%, #0a0a0a 50%, #000000 100%);
        }
        
        .leaderboard-card {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .leaderboard-card:hover {
            animation: card-hover 0.3s ease-out forwards;
        }
        
        .leaderboard-card:hover .challenge-btn {
            animation: challenge-slide 0.3s ease-out forwards;
        }
        
        .wpm-badge {
            animation: wmp-glow 1.5s ease-in-out infinite alternate;
        }
        
        .challenge-btn {
            transform: translateX(100%);
            opacity: 0;
        }
        
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        
        .achievement-badge {
            transition: all 0.2s ease;
        }
        
        .achievement-badge:hover {
            transform: scale(1.2);
        }
        
        .rank-number {
            background: linear-gradient(135deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .top-rank {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .recent-beat {
            animation: rank-pulse 0.5s ease-out;
        }
    </style>
</head>
<body class="min-h-screen gradient-bg text-white font-mono overflow-x-hidden">
    <!-- Floating Particles -->
    <div id="particleContainer" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black bg-opacity-50 backdrop-blur-sm border-b border-gray-800">
        <div class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-neon-teal rounded-lg flex items-center justify-center animate-glow-pulse">
                    <i class="fas fa-keyboard text-black text-sm"></i>
                </div>
                <span class="text-xl font-bold text-neon-teal">TypeForge</span>
            </div>
            <div class="flex items-center space-x-6">
                <a href="#" class="text-light-gray hover:text-neon-teal transition-colors duration-300">Home</a>
                <a href="#" class="text-light-gray hover:text-neon-teal transition-colors duration-300">Test</a>
                <a href="#" class="text-light-gray hover:text-neon-teal transition-colors duration-300">Progress</a>
                <a href="#" class="text-neon-teal font-semibold">Leaderboard</a>
                <a href="#" class="text-light-gray hover:text-neon-teal transition-colors duration-300">Profile</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-16 px-6 relative z-10">
        <div class="container mx-auto max-w-4xl">
            <!-- Header -->
            <div class="text-center mb-12 animate-fade-in-up">
                <h1 class="text-4xl font-bold text-white mb-4">
                    🏆 See where you stand.
                </h1>
                <p class="text-light-gray text-lg">
                    Climb the ranks — challenge your friends, crush your goals.
                </p>
            </div>

            <!-- Toggle Filters -->
            <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-8 mb-12 animate-fade-in">
                <!-- Leaderboard Type Toggle -->
                <div class="flex bg-dark-gray rounded-lg p-1">
                    <button id="globalToggle" class="px-6 py-2 rounded-md text-sm font-semibold transition-all duration-300 bg-neon-teal text-black">
                        Global
                    </button>
                    <button id="friendsToggle" class="px-6 py-2 rounded-md text-sm font-semibold transition-all duration-300 text-light-gray hover:text-white">
                        Friends
                    </button>
                </div>

                <!-- Test Length Selector -->
                <div class="flex bg-dark-gray rounded-lg p-1">
                    <button class="time-filter px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 text-light-gray hover:text-white" data-time="15">
                        15s
                    </button>
                    <button class="time-filter px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 bg-neon-teal text-black" data-time="30">
                        30s
                    </button>
                    <button class="time-filter px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 text-light-gray hover:text-white" data-time="60">
                        60s
                    </button>
                </div>
            </div>

            <!-- Leaderboard List -->
            <div class="space-y-4 animate-fade-in-up" style="animation-delay: 0.2s;">
                <div id="leaderboardList">
                    <!-- Leaderboard items will be populated by JavaScript -->
                </div>
            </div>

            <!-- Motivational Footer -->
            <div class="text-center mt-16 animate-fade-in" style="animation-delay: 0.4s;">
                <p class="text-light-gray text-lg italic">
                    Every keystroke brings you closer to the top.
                </p>
            </div>
        </div>
    </main>

    <!-- Challenge Modal -->
    <div id="challengeModal" class="fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-dark-gray bg-opacity-90 backdrop-blur-sm rounded-xl p-8 max-w-md mx-4 border border-gray-700 animate-fade-in-up">
            <div class="text-center">
                <div class="text-4xl mb-4">⚔️</div>
                <h2 class="text-2xl font-bold text-neon-teal mb-4">Challenge Sent!</h2>
                <div id="challengeDetails" class="text-light-gray mb-6">
                    <!-- Challenge details will be populated by JavaScript -->
                </div>
                <div class="space-y-3">
                    <button id="startChallenge" class="w-full bg-neon-teal text-black py-3 px-6 rounded-lg font-semibold hover:bg-cyan-300 transition-all duration-300 transform hover:scale-105">
                        Start Challenge Now
                    </button>
                    <button id="closeChallenge" class="w-full bg-transparent border border-neon-teal text-neon-teal py-3 px-6 rounded-lg font-semibold hover:bg-neon-teal hover:text-black transition-all duration-300">
                        Maybe Later
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Define leaderboard data
        const globalLeaderboard = [
            {
                id: 1,
                rank: 1,
                username: "SpeedDemon",
                avatar: "https://picsum.photos/40?random=1",
                wpm: 142,
                accuracy: 98.5,
                achievements: ["🔥", "👑", "⚡"],
                isCurrentUser: false,
                recentlyBeat: false
            },
            {
                id: 2,
                rank: 2,
                username: "KeyboardNinja",
                avatar: "https://picsum.photos/40?random=2",
                wpm: 138,
                accuracy: 97.8,
                achievements: ["🔥", "🎯", "⚡"],
                isCurrentUser: false,
                recentlyBeat: false
            },
            {
                id: 3,
                rank: 3,
                username: "TypeMaster",
                avatar: "https://picsum.photos/40?random=3",
                wpm: 135,
                accuracy: 99.2,
                achievements: ["🎯", "👑", "💎"],
                isCurrentUser: false,
                recentlyBeat: false
            },
            {
                id: 4,
                rank: 4,
                username: "QuickFingers",
                avatar: "https://picsum.photos/40?random=4",
                wpm: 128,
                accuracy: 96.7,
                achievements: ["🔥", "⚡"],
                isCurrentUser: false,
                recentlyBeat: true
            },
            {
                id: 5,
                rank: 5,
                username: "You",
                avatar: "https://picsum.photos/40?random=5",
                wpm: 125,
                accuracy: 97.3,
                achievements: ["🔥", "🎯"],
                isCurrentUser: true,
                recentlyBeat: false
            },
            {
                id: 6,
                rank: 6,
                username: "FastTyper",
                avatar: "https://picsum.photos/40?random=6",
                wpm: 122,
                accuracy: 95.8,
                achievements: ["⚡"],
                isCurrentUser: false,
                recentlyBeat: false
            },
            {
                id: 7,
                rank: 7,
                username: "RapidKeys",
                avatar: "https://picsum.photos/40?random=7",
                wpm: 118,
                accuracy: 98.1,
                achievements: ["🎯", "💎"],
                isCurrentUser: false,
                recentlyBeat: false
            },
            {
                id: 8,
                rank: 8,
                username: "SwiftType",
                avatar: "https://picsum.photos/40?random=8",
                wpm: 115,
                accuracy: 96.4,
                achievements: ["🔥"],
                isCurrentUser: false,
                recentlyBeat: false
            }
        ];

        const friendsLeaderboard = [
            {
                id: 1,
                rank: 1,
                username: "BestFriend",
                avatar: "https://picsum.photos/40?random=11",
                wpm: 130,
                accuracy: 97.5,
                achievements: ["🔥", "👑"],
                isCurrentUser: false,
                recentlyBeat: true
            },
            {
                id: 2,
                rank: 2,
                username: "You",
                avatar: "https://picsum.photos/40?random=5",
                wpm: 125,
                accuracy: 97.3,
                achievements: ["🔥", "🎯"],
                isCurrentUser: true,
                recentlyBeat: false
            },
            {
                id: 3,
                rank: 3,
                username: "Colleague",
                avatar: "https://picsum.photos/40?random=12",
                wpm: 118,
                accuracy: 95.2,
                achievements: ["⚡"],
                isCurrentUser: false,
                recentlyBeat: false
            }
        ];

        // Game state
        let currentLeaderboard = "global";
        let currentTimeFilter = "30";
        let challengeTarget = null;

        // Initialize the page
        document.addEventListener("DOMContentLoaded", function() {
            createFloatingParticles();
            setupEventListeners();
            renderLeaderboard();
        });

        function createFloatingParticles() {
            const container = document.getElementById("particleContainer");
            
            function createParticle() {
                const particle = document.createElement("div");
                particle.className = "particle";
                particle.style.left = Math.random() * 100 + "%";
                particle.style.animationDuration = (8 + Math.random() * 4) + "s";
                particle.style.animationDelay = Math.random() * 2 + "s";
                particle.style.opacity = 0.1 + Math.random() * 0.3;
                
                container.appendChild(particle);
                
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.remove();
                    }
                }, 12000);
            }
            
            // Create initial particles
            for (let i = 0; i < 5; i++) {
                setTimeout(createParticle, i * 1000);
            }
            
            // Continue creating particles
            setInterval(createParticle, 2000);
        }

        function setupEventListeners() {
            // Leaderboard type toggles
            document.getElementById("globalToggle").addEventListener("click", () => switchLeaderboard("global"));
            document.getElementById("friendsToggle").addEventListener("click", () => switchLeaderboard("friends"));
            
            // Time filter buttons
            document.querySelectorAll(".time-filter").forEach(button => {
                button.addEventListener("click", () => switchTimeFilter(button.dataset.time));
            });
            
            // Challenge modal
            document.getElementById("startChallenge").addEventListener("click", startChallenge);
            document.getElementById("closeChallenge").addEventListener("click", closeChallenge);
        }

        function switchLeaderboard(type) {
            currentLeaderboard = type;
            
            // Update toggle buttons
            const globalBtn = document.getElementById("globalToggle");
            const friendsBtn = document.getElementById("friendsToggle");
            
            if (type === "global") {
                globalBtn.className = "px-6 py-2 rounded-md text-sm font-semibold transition-all duration-300 bg-neon-teal text-black";
                friendsBtn.className = "px-6 py-2 rounded-md text-sm font-semibold transition-all duration-300 text-light-gray hover:text-white";
            } else {
                friendsBtn.className = "px-6 py-2 rounded-md text-sm font-semibold transition-all duration-300 bg-neon-teal text-black";
                globalBtn.className = "px-6 py-2 rounded-md text-sm font-semibold transition-all duration-300 text-light-gray hover:text-white";
            }
            
            renderLeaderboard();
        }

        function switchTimeFilter(time) {
            currentTimeFilter = time;
            
            // Update time filter buttons
            document.querySelectorAll(".time-filter").forEach(button => {
                if (button.dataset.time === time) {
                    button.className = "time-filter px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 bg-neon-teal text-black";
                } else {
                    button.className = "time-filter px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 text-light-gray hover:text-white";
                }
            });
            
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const container = document.getElementById("leaderboardList");
            const data = currentLeaderboard === "global" ? globalLeaderboard : friendsLeaderboard;
            
            container.innerHTML = data.map(user => createLeaderboardCard(user)).join("");
            
            // Add event listeners to challenge buttons
            document.querySelectorAll(".challenge-button").forEach(button => {
                button.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const userId = parseInt(button.dataset.userId);
                    const user = data.find(u => u.id === userId);
                    showChallengeModal(user);
                });
            });
        }

        function createLeaderboardCard(user) {
            const rankClass = user.rank <= 3 ? "top-rank" : "rank-number";
            const cardClass = user.isCurrentUser ? "border-neon-teal border-2" : "border-gray-700 border";
            const recentBeatText = user.recentlyBeat ? '<div class="text-xs text-orange-400 recent-beat">💥 Just passed you!</div>' : "";
            
            return `
                <div class="leaderboard-card ${cardClass} bg-card-bg rounded-xl p-6 ${user.isCurrentUser ? 'bg-opacity-20' : ''}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <!-- Rank -->
                            <div class="text-2xl font-bold ${rankClass} min-w-[3rem] text-center">
                                ${user.rank <= 3 ? getRankEmoji(user.rank) : `#${user.rank}`}
                            </div>
                            
                            <!-- Avatar and User Info -->
                            <div class="flex items-center space-x-3">
                                <img src="${user.avatar}" alt="${user.username}" class="w-12 h-12 rounded-full border-2 border-gray-600">
                                <div>
                                    <div class="font-semibold text-white ${user.isCurrentUser ? 'text-neon-teal' : ''}">
                                        ${user.username} ${user.isCurrentUser ? '(You)' : ''}
                                    </div>
                                    <div class="text-sm text-light-gray">
                                        Accuracy: ${user.accuracy}%
                                    </div>
                                    ${recentBeatText}
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center space-x-4">
                            <!-- Achievements -->
                            <div class="flex space-x-1">
                                ${user.achievements.map(badge => 
                                    `<span class="achievement-badge text-lg cursor-pointer" title="Achievement">${badge}</span>`
                                ).join("")}
                            </div>
                            
                            <!-- WPM Badge -->
                            <div class="text-right">
                                <div class="text-3xl font-bold text-neon-teal wmp-badge">
                                    ${user.wpm}
                                </div>
                                <div class="text-xs text-light-gray">WPM</div>
                            </div>
                            
                            <!-- Challenge Button -->
                            ${!user.isCurrentUser ? `
                                <button class="challenge-btn challenge-button bg-neon-teal text-black px-4 py-2 rounded-lg font-semibold hover:bg-cyan-300 transition-all duration-300 transform hover:scale-105" data-user-id="${user.id}">
                                    ⚔ Challenge
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function getRankEmoji(rank) {
            switch(rank) {
                case 1: return "🥇";
                case 2: return "🥈";
                case 3: return "🥉";
                default: return `#${rank}`;
            }
        }

        function showChallengeModal(user) {
            challengeTarget = user;
            document.getElementById("challengeDetails").innerHTML = `
                <div class="text-center">
                    <img src="${user.avatar}" alt="${user.username}" class="w-16 h-16 rounded-full border-2 border-neon-teal mx-auto mb-4">
                    <div class="text-lg font-semibold text-white mb-2">Challenge ${user.username}</div>
                    <div class="text-light-gray mb-4">
                        Beat their ${user.wpm} WPM score in a ${currentTimeFilter}s test
                    </div>
                    <div class="bg-dark-gray rounded-lg p-3">
                        <div class="text-sm text-light-gray">Target to beat:</div>
                        <div class="text-2xl font-bold text-neon-teal">${user.wpm} WPM</div>
                        <div class="text-sm text-light-gray">${user.accuracy}% accuracy</div>
                    </div>
                </div>
            `;
            document.getElementById("challengeModal").classList.remove("hidden");
        }

        function startChallenge() {
            // Navigate to typing test with challenge parameters
            const challengeUrl = `#test?challenge=${challengeTarget.id}&time=${currentTimeFilter}&target=${challengeTarget.wpm}`;
            window.location.href = challengeUrl;
            closeChallenge();
        }

        function closeChallenge() {
            document.getElementById("challengeModal").classList.add("hidden");
            challengeTarget = null;
        }

        // Add particle animation styles
        const particleStyle = document.createElement("style");
        particleStyle.textContent = `
            .particle {
                animation: particle-float 8s ease-in-out infinite;
            }
        `;
        document.head.appendChild(particleStyle);
    </script>

</body></html>
