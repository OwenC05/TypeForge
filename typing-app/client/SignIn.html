    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeForge - Welcome back to your typing dojo</title>
    <meta name="description" content="Login to TypeForge - Your personal AI-powered typing coach. Secure access to your typing progress and personalized training.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-teal': '#00ffff',
                        'deep-navy': '#0a0f1c',
                        'dark-navy': '#1a1f2e',
                        'glass-bg': 'rgba(255, 255, 255, 0.1)'
                    },
                    animation: {
                        'circuit-flow': 'circuit-flow 8s linear infinite',
                        'pulse-gentle': 'pulse-gentle 2s ease-in-out infinite',
                        'sparkle-drift': 'sparkle-drift 3s ease-in-out infinite',
                        'glow-pulse': 'glow-pulse 2s ease-in-out infinite alternate',
                        'fade-in': 'fade-in 0.5s ease-out',
                        'slide-up': 'slide-up 0.6s ease-out',
                        'success-bounce': 'success-bounce 0.8s ease-out'
                    },
                    keyframes: {
                        'circuit-flow': {
                            '0%': { transform: 'translateY(100vh)', opacity: '0' },
                            '10%': { opacity: '1' },
                            '90%': { opacity: '1' },
                            '100%': { transform: 'translateY(-100vh)', opacity: '0' }
                        },
                        'pulse-gentle': {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.7' },
                            '50%': { transform: 'scale(1.1)', opacity: '1' }
                        },
                        'sparkle-drift': {
                            '0%': { transform: 'translateY(0) translateX(0)', opacity: '0' },
                            '50%': { opacity: '1' },
                            '100%': { transform: 'translateY(-20px) translateX(10px)', opacity: '0' }
                        },
                        'glow-pulse': {
                            '0%': { boxShadow: '0 0 20px rgba(0, 255, 255, 0.3)' },
                            '100%': { boxShadow: '0 0 40px rgba(0, 255, 255, 0.6)' }
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        'slide-up': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        'success-bounce': {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '50%': { transform: 'scale(1.1)' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        }
                    },
                    backdropBlur: {
                        'xs': '2px'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #0a0f1c 0%, #000000 100%);
        }
        
        .circuit-line {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(180deg, transparent, #00ffff, transparent);
            opacity: 0.6;
        }
        
        .keyboard-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            opacity: 0.4;
        }
        
        .frosted-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .input-glow:focus {
            border-color: #00ffff;
            box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.2);
            outline: none;
        }
        
        .underline-glow {
            position: relative;
        }
        
        .underline-glow::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #00ffff;
            transition: width 0.3s ease;
        }
        
        .underline-glow:focus::after {
            width: 100%;
        }
        
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .hover-scale:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }
        
        .text-glow {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg text-white overflow-hidden">
    <!-- Sticky Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black bg-opacity-30 backdrop-blur-sm">
        <div class="container mx-auto px-6 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-6 h-6 bg-neon-teal rounded text-black flex items-center justify-center font-bold text-sm">
                        T
                    </div>
                    <span class="text-lg font-bold text-neon-teal">TypeForge</span>
                </div>
                <a href="#" class="text-gray-300 hover:text-neon-teal transition-colors duration-300 text-sm">
                    ← Home
                </a>
            </div>
        </div>
    </nav>

    <div class="flex min-h-screen pt-16">
        <!-- Left Side - Animated Background -->
        <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
            <!-- Animated Circuit Lines -->
            <div class="absolute inset-0">
                <div class="circuit-line animate-circuit-flow" style="left: 10%; animation-delay: 0s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 20%; animation-delay: 2s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 30%; animation-delay: 4s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 40%; animation-delay: 1s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 50%; animation-delay: 3s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 60%; animation-delay: 5s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 70%; animation-delay: 2.5s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 80%; animation-delay: 4.5s;"></div>
                <div class="circuit-line animate-circuit-flow" style="left: 90%; animation-delay: 1.5s;"></div>
            </div>
            
            <!-- Keyboard Lines -->
            <div class="absolute inset-0">
                <div class="keyboard-line" style="top: 20%; width: 60%; left: 10%; transform: rotate(-15deg);"></div>
                <div class="keyboard-line" style="top: 40%; width: 80%; left: 5%; transform: rotate(10deg);"></div>
                <div class="keyboard-line" style="top: 60%; width: 70%; left: 15%; transform: rotate(-5deg);"></div>
                <div class="keyboard-line" style="top: 80%; width: 50%; left: 20%; transform: rotate(20deg);"></div>
            </div>
            
            <!-- Glowing Orbs -->
            <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-neon-teal opacity-10 rounded-full blur-3xl animate-pulse-gentle"></div>
            <div class="absolute bottom-1/4 right-1/4 w-24 h-24 bg-neon-teal opacity-15 rounded-full blur-2xl animate-pulse-gentle" style="animation-delay: 1s;"></div>
        </div>

        <!-- Right Side - Form Container -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-6">
            <div class="w-full max-w-md">
                <!-- Form Container -->
                <div class="frosted-glass rounded-2xl p-8 animate-slide-up" id="form-container">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <h1 class="text-2xl text-gray-300 mb-2">Welcome back to your typing dojo.</h1>
                        <div class="w-12 h-1 bg-neon-teal mx-auto rounded"></div>
                    </div>

                    <!-- Login Form -->
                    <form id="login-form" class="space-y-6">
                        <!-- Email Field -->
                        <div>
                            <label for="email" class="block text-sm text-gray-400 mb-2">Email</label>
                            <input type="email" id="email" name="email" class="w-full bg-transparent border-b-2 border-gray-600 py-3 px-0 text-white placeholder-gray-500 input-glow underline-glow transition-all duration-300" placeholder="Enter your email" required="">
                            <div class="error-message text-red-400 text-xs mt-1 hidden" id="email-error">
                                Please enter a valid email.
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div>
                            <label for="password" class="block text-sm text-gray-400 mb-2">
                                <i class="fas fa-lock text-neon-teal mr-1"></i>
                                Password
                            </label>
                            <div class="relative">
                                <input type="password" id="password" name="password" class="w-full bg-transparent border-b-2 border-gray-600 py-3 px-0 pr-10 text-white placeholder-gray-500 input-glow underline-glow transition-all duration-300" placeholder="Enter your password" required="">
                                <button type="button" class="absolute right-0 top-3 text-gray-400 hover:text-neon-teal transition-colors duration-300" id="toggle-password">
                                    <i class="fas fa-eye" id="eye-icon"></i>
                                </button>
                            </div>
                            <div class="error-message text-red-400 text-xs mt-1 hidden" id="password-error">
                                Password is required.
                            </div>
                        </div>

                        <!-- Login Button -->
                        <div class="relative">
                            <button type="submit" class="w-full bg-neon-teal text-black py-3 rounded-lg font-semibold hover-scale animate-glow-pulse transition-all duration-300" id="login-button">
                                Log In ➔
                            </button>
                            <!-- Sparkles -->
                            <div class="sparkle animate-sparkle-drift" style="top: 5px; right: 20px; animation-delay: 0s;"></div>
                            <div class="sparkle animate-sparkle-drift" style="bottom: 5px; left: 30px; animation-delay: 1s;"></div>
                            <div class="sparkle animate-sparkle-drift" style="top: 10px; left: 50px; animation-delay: 2s;"></div>
                        </div>

                        <!-- Signup Link -->
                        <div class="text-center">
                            <a href="#" class="text-gray-400 hover:text-neon-teal transition-colors duration-300 underline-animate" id="signup-link">
                                New here? Create your account ➔
                            </a>
                        </div>

                        <!-- Divider -->
                        <div class="flex items-center my-6">
                            <div class="flex-1 h-px bg-gray-600"></div>
                            <span class="px-4 text-gray-400 text-sm">or</span>
                            <div class="flex-1 h-px bg-gray-600"></div>
                        </div>

                        <!-- Social Login -->
                        <div class="space-y-3">
                            <button type="button" class="w-full bg-white bg-opacity-10 border border-gray-600 py-3 rounded-lg flex items-center justify-center space-x-3 hover:bg-opacity-20 transition-all duration-300 hover-scale" id="google-login">
                                <i class="fab fa-google text-red-400 animate-pulse-gentle"></i>
                                <span>Continue with Google</span>
                            </button>
                            
                            <button type="button" class="w-full bg-white bg-opacity-10 border border-gray-600 py-3 rounded-lg flex items-center justify-center space-x-3 hover:bg-opacity-20 transition-all duration-300 hover-scale" id="github-login">
                                <i class="fab fa-github text-gray-300 animate-pulse-gentle" style="animation-delay: 0.5s;"></i>
                                <span>Continue with Github</span>
                            </button>
                        </div>

                        <!-- Security Notice -->
                        <div class="text-center mt-6">
                            <p class="text-xs text-gray-500">
                                <i class="fas fa-shield-alt text-neon-teal mr-1"></i>
                                Your data is secure &amp; private.
                            </p>
                        </div>
                    </form>

                    <!-- Success Message -->
                    <div class="hidden text-center animate-success-bounce" id="success-message">
                        <div class="text-neon-teal text-4xl mb-4">🎉</div>
                        <p class="text-neon-teal text-lg font-semibold">
                            Logged in — let's level up your typing!
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Form validation and interaction data
        const formFields = [
            { "id": "email", "type": "email", "required": true },
            { "id": "password", "type": "password", "required": true }
        ];

        const socialProviders = [
            { "id": "google", "name": "Google", "icon": "fab fa-google" },
            { "id": "github", "name": "Github", "icon": "fab fa-github" }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            // Prevent default navigation
            const links = document.querySelectorAll('a[href^="#"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Navigation to:', this.getAttribute('href'));
                });
            });

            // Password toggle functionality
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                eyeIcon.classList.toggle('fa-eye');
                eyeIcon.classList.toggle('fa-eye-slash');
            });

            // Form validation
            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function showError(fieldId, message) {
                const errorElement = document.getElementById(fieldId + '-error');
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
            }

            function hideError(fieldId) {
                const errorElement = document.getElementById(fieldId + '-error');
                errorElement.classList.add('hidden');
            }

            // Real-time validation
            document.getElementById('email').addEventListener('blur', function() {
                const email = this.value.trim();
                if (email && !validateEmail(email)) {
                    showError('email', 'Please enter a valid email.');
                } else {
                    hideError('email');
                }
            });

            document.getElementById('password').addEventListener('blur', function() {
                const password = this.value.trim();
                if (!password) {
                    showError('password', 'Password is required.');
                } else {
                    hideError('password');
                }
            });

            // Form submission
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                let isValid = true;

                // Validate email
                if (!email) {
                    showError('email', 'Email is required.');
                    isValid = false;
                } else if (!validateEmail(email)) {
                    showError('email', 'Please enter a valid email.');
                    isValid = false;
                } else {
                    hideError('email');
                }

                // Validate password
                if (!password) {
                    showError('password', 'Password is required.');
                    isValid = false;
                } else {
                    hideError('password');
                }

                if (isValid) {
                    // Simulate successful login
                    setTimeout(() => {
                        document.getElementById('login-form').classList.add('hidden');
                        document.getElementById('success-message').classList.remove('hidden');
                        
                        // Redirect after success message
                        setTimeout(() => {
                            console.log('Redirecting to dashboard...');
                        }, 2000);
                    }, 500);
                }
            });

            // Social login handlers
            document.getElementById('google-login').addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Google login initiated...');
            });

            document.getElementById('github-login').addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Github login initiated...');
            });

            // Signup link handler
            document.getElementById('signup-link').addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Switching to signup form...');
            });

            // Add more circuit lines dynamically
            function createCircuitLine() {
                const line = document.createElement('div');
                line.className = 'circuit-line animate-circuit-flow';
                line.style.left = Math.random() * 100 + '%';
                line.style.animationDelay = '0s';
                line.style.animationDuration = (Math.random() * 4 + 6) + 's';
                
                const leftPanel = document.querySelector('.lg\\:w-1\\/2 .absolute.inset-0');
                if (leftPanel) {
                    leftPanel.appendChild(line);
                    
                    // Remove line after animation
                    setTimeout(() => {
                        line.remove();
                    }, 10000);
                }
            }

            // Create new circuit lines periodically
            setInterval(createCircuitLine, 3000);

            // Add sparkles on button hover
            const loginButton = document.getElementById('login-button');
            loginButton.addEventListener('mouseenter', function() {
                // Create additional sparkles on hover
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'sparkle animate-sparkle-drift';
                        sparkle.style.top = Math.random() * 40 + 'px';
                        sparkle.style.left = Math.random() * 200 + 'px';
                        sparkle.style.animationDelay = '0s';
                        
                        this.parentElement.appendChild(sparkle);
                        
                        setTimeout(() => {
                            sparkle.remove();
                        }, 3000);
                    }, i * 200);
                }
            });
        });
    </script>

</body></html>
