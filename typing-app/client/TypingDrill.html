<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeForge</title>
  <script>
    const source = new URLSearchParams(location.search);
    const target = new URLSearchParams({mode: 'practice'});
    for (const key of ['duration', 'qwerty', 'practice', 'pair']) {
      const value = source.get(key);
      if (value !== null) target.set(key, value);
    }
    for (const key of ['from', 'retest']) {
      const value = source.get(key);
      if (value && /^[a-zA-Z0-9_-]{1,80}$/.test(value)) target.set(key, value);
    }
    location.replace('./practice.html?' + target);
  </script>
</head>
<body><p>This page has moved. <a href="./practice.html?mode=practice">Continue to TypeForge</a>.</p></body>
</html>
