            color: #666666;
        }
        
        .word-active {
            border-bottom: 1px solid #00ffff;
            padding-bottom: 2px;
        }
        
        .char-correct {
            color: #999999;
        }
        
        .char-incorrect {
            color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.1);
            border-bottom: 1px solid #ff6b6b;
            animation: error-bounce 0.3s ease-out;
        }
        
        .char-extra {
            color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.2);
        }
        
        .focus-mode {
            background: radial-gradient(circle at center, #000000 0%, #000000 60%, rgba(0, 0, 0, 0.95) 100%);
        }
        
        .stat-glow:hover {
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }
        
        .streak-indicator {
            border-bottom: 2px solid transparent;
            animation: streak-flash 0.5s ease-out;
        }
        
        .results-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }
        
        .modal-container {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            animation: modal-glow 3s ease-in-out infinite;
        }
        
        .wpm-counter {
            animation: count-up 1.5s ease-out;
        }
        
        .confetti-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #00ffff;
            border-radius: 50%;
            animation: confetti-burst 0.8s ease-out forwards;
        }
        
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            animation: sparkle-drift 2s ease-out infinite;
        }
        
        .personal-best-badge {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            animation: pulse-gentle 2s ease-in-out infinite;
        }
        
        .cta-primary:hover {
            animation: scale-bounce 0.2s ease-out;
        }
        
        .ai-insight {
            color: #cccccc;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .encouragement-text {
            color: #999999;
            font-size: 0.85rem;
        }

<body class="bg-pure-black text-white font-mono min-h-screen overflow-hidden select-none">
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black bg-opacity-50 backdrop-blur-sm border-b border-gray-800">

    </nav>

    <div class="pt-20 min-h-screen flex flex-col items-center justify-center" id="main-container">
        <!-- Stats Bar -->
        <div class="mb-8 flex items-center space-x-8 text-center" id="stats-bar">
            <div class="stat-glow transition-all duration-300">
                <div class="text-2xl font-bold text-neon-teal" id="wpm-display">0</div>
                <div class="text-xs text-gray-400">WPM</div>
            </div>
            <div class="stat-glow transition-all duration-300">
                <div class="text-2xl font-bold text-neon-teal" id="accuracy-display">100</div>
                <div class="text-xs text-gray-400">ACC%</div>
            </div>
            <div class="stat-glow transition-all duration-300">
                <div class="text-2xl font-bold text-neon-teal" id="timer-display">15</div>
                <div class="text-xs text-gray-400">TIME</div>
            </div>
        </div>

        <!-- Mode Selection -->
        <div class="mb-8 flex items-center space-x-4" id="mode-selection">
            <button class="mode-btn px-4 py-2 border border-gray-600 rounded text-sm hover:border-neon-teal transition-colors duration-300" data-time="15">15s</button>
            <button class="mode-btn px-4 py-2 border border-neon-teal bg-neon-teal bg-opacity-10 rounded text-sm text-neon-teal" data-time="30">30s</button>
            <button class="mode-btn px-4 py-2 border border-gray-600 rounded text-sm hover:border-neon-teal transition-colors duration-300" data-time="60">60s</button>
            <button class="mode-btn px-4 py-2 border border-gray-600 rounded text-sm hover:border-neon-teal transition-colors duration-300" data-time="120">2m</button>
        </div>

        <!-- Typing Area -->
        <div class="max-w-4xl mx-auto px-6" id="typing-container">
            <div class="text-xl leading-relaxed" id="text-display">

            </div>
            
            <!-- Hidden Input -->
            <input type="text" id="typing-input" class="absolute opacity-0 pointer-events-none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>

        <!-- Instructions -->
        <div class="mt-12 text-center text-gray-500 text-sm" id="instructions">
            <p>Click here or press any key to start typing</p>
        </div>

    <!-- Enhanced Results Modal -->
    <div class="fixed inset-0 results-overlay flex items-center justify-center hidden animate-fade-in z-50" id="results-overlay">

            <div class="mb-6 relative">
                <div class="wpm-counter text-6xl font-bold text-neon-teal mb-2" id="final-wpm-animated">0</div>

            <!-- Accuracy Display -->
            <div class="mb-6 animate-fade-in-up" style="animation-delay: 0.3s; animation-fill-mode: both;">

            <div class="mb-6 animate-fade-in-up" style="animation-delay: 0.6s; animation-fill-mode: both;">

            <div class="mb-8 animate-fade-in-up" style="animation-delay: 0.9s; animation-fill-mode: both;">

            <!-- CTA Buttons -->
            <div class="space-y-4 animate-fade-in-up" style="animation-delay: 1.2s; animation-fill-mode: both;">
                <button class="cta-primary w-full bg-neon-teal text-black py-3 px-6 rounded-lg font-semibold hover:bg-opacity-90 transition-all duration-300 relative overflow-hidden" id="view-detailed-results-btn">
                    <span class="relative z-10">View detailed results ➔</span>
                    <div class="sparkles-button absolute inset-0 pointer-events-none" id="button-sparkles"></div>
                </button>
                <button class="text-gray-400 hover:text-neon-teal transition-colors duration-300 text-sm underline" id="run-again-btn">

        </div>
    </div>

    <script>
        // Test configuration and word lists
        const testWords = [
            "the", "quick", "brown", "fox", "jumps", "over", "lazy", "dog", "and", "runs", "through", "forest", "with", "great", "speed", "while", "birds", "sing", "in", "trees",
            "computer", "keyboard", "typing", "practice", "improve", "accuracy", "speed", "words", "minute", "test", "challenge", "focus", "concentration", "skill", "development",
            "programming", "software", "technology", "digital", "modern", "efficient", "productive", "learning", "progress", "achievement", "success", "dedication", "persistence",
            "beautiful", "wonderful", "amazing", "fantastic", "incredible", "outstanding", "excellent", "perfect", "brilliant", "magnificent", "spectacular", "extraordinary",
            "create", "build", "develop", "design", "implement", "execute", "achieve", "accomplish", "complete", "finish", "succeed", "master", "learn", "practice", "improve"
        ];

        const testModes = [
            { "time": 15, "label": "15s" },
            { "time": 30, "label": "30s" },
            { "time": 60, "label": "60s" },
            { "time": 120, "label": "2m" }
        ];

        const aiInsights = [
            "�� Your 'th' errors dropped 18% vs last run.",
            "💡 Try to sustain pace — your last 5s dipped by 10 WPM.",
            "⚡ Your right hand is 12% faster than your left.",
            "🎯 'ing' combinations are your strongest pattern.",
            "📈 Your accuracy improved 8% from yesterday.",
            "🚀 You're hitting your stride around the 15s mark.",
            "💪 Your backspace usage decreased by 23%.",
            "🔍 Focus on 'qu' combinations for better flow.",
            "⭐ Your consistency improved significantly.",
            "🎪 Double letters are your secret weapon."
        ];

        const encouragementMessages = [
            "Looking sharp — keep refining those left hand reaches.",
            "Solid rhythm — try maintaining that flow longer.",
            "Great accuracy focus — speed will follow naturally.",
            "Your muscle memory is building beautifully.",
            "Excellent progress — consistency is key.",
            "Nice work on those tricky letter combinations.",
            "Your typing posture is paying off.",
            "Keep that steady pace — you're in the zone.",
            "Beautiful finger independence showing.",
            "Your dedication is clearly paying dividends."
        ];

        // Game state
        let gameState = {
            isActive: false,
            isPaused: false,
            startTime: null,
            endTime: null,
            currentMode: 30,
            currentWordIndex: 0,
            currentCharIndex: 0,
            words: [],
            userInput: "",
            correctChars: 0,
            incorrectChars: 0,
            totalChars: 0,
            streakCount: 0,
            wpm: 0,
            accuracy: 100,
            timeLeft: 30,
            personalBest: 45 // Simulated personal best
        };

        // DOM elements
        const elements = {
            textDisplay: document.getElementById('text-display'),
            typingInput: document.getElementById('typing-input'),
            wpmDisplay: document.getElementById('wpm-display'),
            accuracyDisplay: document.getElementById('accuracy-display'),
            timerDisplay: document.getElementById('timer-display'),
            instructions: document.getElementById('instructions'),
            resultsOverlay: document.getElementById('results-overlay'),
            mainContainer: document.getElementById('main-container'),
            modeButtons: document.querySelectorAll('.mode-btn')
        };

        // Initialize game
        function initializeGame() {
            generateWords();
            renderText();
            resetStats();
            setupEventListeners();
        }

        // Generate random words for the test
        function generateWords() {
            gameState.words = [];
            for (let i = 0; i < 200; i++) {
                const randomWord = testWords[Math.floor(Math.random() * testWords.length)];
                gameState.words.push(randomWord);
            }
        }

        // Render text display
        function renderText() {
            elements.textDisplay.innerHTML = '';
            
            for (let wordIndex = 0; wordIndex < Math.min(gameState.words.length, 50); wordIndex++) {
                const word = gameState.words[wordIndex];
                const wordElement = document.createElement('span');
                wordElement.className = 'word mr-2';
                wordElement.setAttribute('data-word-index', wordIndex);
                
                if (wordIndex === gameState.currentWordIndex) {
                    wordElement.classList.add('word-active');
                } else if (wordIndex < gameState.currentWordIndex) {
                    wordElement.classList.add('word-correct');
                }
                
                for (let charIndex = 0; charIndex < word.length; charIndex++) {
                    const charElement = document.createElement('span');
                    charElement.textContent = word[charIndex];
                    charElement.setAttribute('data-char-index', charIndex);
                    
                    if (wordIndex === gameState.currentWordIndex) {
                        const userWord = gameState.userInput;
                        if (charIndex < userWord.length) {
                            if (userWord[charIndex] === word[charIndex]) {
                                charElement.classList.add('char-correct');
                            } else {
                                charElement.classList.add('char-incorrect');
                            }
                        }
                        
                        if (charIndex === userWord.length && wordIndex === gameState.currentWordIndex) {
                            charElement.classList.add('typing-cursor');
                        }
                    }
                    
                    wordElement.appendChild(charElement);
                }
                
                // Add extra characters if user typed more than word length
                if (wordIndex === gameState.currentWordIndex && gameState.userInput.length > word.length) {
                    for (let i = word.length; i < gameState.userInput.length; i++) {
                        const extraChar = document.createElement('span');
                        extraChar.textContent = gameState.userInput[i];
                        extraChar.classList.add('char-extra');
                        wordElement.appendChild(extraChar);
                    }
                }
                
                elements.textDisplay.appendChild(wordElement);
                
                // Add space after word (except last word)
                if (wordIndex < Math.min(gameState.words.length, 50) - 1) {
                    const spaceElement = document.createElement('span');
                    spaceElement.textContent = ' ';
                    elements.textDisplay.appendChild(spaceElement);
                }
            }
        }

        // Start the typing test
        function startTest() {
            if (gameState.isActive) return;
            
            gameState.isActive = true;
            gameState.startTime = Date.now();
            gameState.timeLeft = gameState.currentMode;
            elements.instructions.style.display = 'none';
            elements.mainContainer.classList.add('focus-mode');
            
            // Start timer
            const timer = setInterval(() => {
                gameState.timeLeft--;
                elements.timerDisplay.textContent = gameState.timeLeft;
                
                if (gameState.timeLeft <= 0) {
                    clearInterval(timer);
                    endTest();
                }
            }, 1000);
            
            // Focus input
            elements.typingInput.focus();
        }

        // End the typing test
        function endTest() {
            gameState.isActive = false;
            gameState.endTime = Date.now();
            elements.mainContainer.classList.remove('focus-mode');
            calculateFinalStats();
            showEnhancedResults();
        }

        // Calculate final statistics
        function calculateFinalStats() {
            const timeElapsed = (gameState.endTime - gameState.startTime) / 1000 / 60; // in minutes
            const wordsTyped = gameState.correctChars / 5; // Standard: 5 chars = 1 word
            gameState.wpm = Math.round(wordsTyped / timeElapsed);
            gameState.accuracy = Math.round((gameState.correctChars / gameState.totalChars) * 100) || 100;
        }

        // Animate WPM counter
        function animateWPMCounter(targetWPM) {
            const wpmElement = document.getElementById('final-wpm-animated');
            let currentWPM = 0;
            const increment = Math.ceil(targetWPM / 30); // 30 steps
            const duration = 1500; // 1.5 seconds
            const stepTime = duration / 30;
            
            const counter = setInterval(() => {
                currentWPM += increment;
                if (currentWPM >= targetWPM) {
                    currentWPM = targetWPM;
                    clearInterval(counter);
                }
                wpmElement.textContent = currentWPM;
            }, stepTime);
        }

        // Create confetti burst
        function createConfettiBurst() {
            const container = document.getElementById('sparkles-container');
            const colors = ['#00ffff', '#0080ff', '#ffffff'];
            
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 0.3 + 's';
                container.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        // Create floating sparkles
        function createFloatingSparkles() {
            const container = document.getElementById('sparkles-container');
            
            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(sparkle);
                
                setTimeout(() => {
                    sparkle.remove();
                }, 2000);
            }
        }

        // Show enhanced results modal
        function showEnhancedResults() {
            const isPersonalBest = gameState.wpm > gameState.personalBest;
            
            // Update accuracy display
            document.getElementById('final-accuracy-display').textContent = gameState.accuracy + '%';
            
            // Set AI insight
            const randomInsight = aiInsights[Math.floor(Math.random() * aiInsights.length)];
            document.getElementById('ai-insight').textContent = randomInsight;
            
            // Set encouragement message
            const randomEncouragement = encouragementMessages[Math.floor(Math.random() * encouragementMessages.length)];
            document.getElementById('encouragement-text').textContent = randomEncouragement;
            
            // Show personal best badge if applicable
            if (isPersonalBest) {
                document.getElementById('personal-best-badge').classList.remove('hidden');
                setTimeout(() => {
                    createConfettiBurst();
                }, 500);
            }
            
            // Show modal
            elements.resultsOverlay.classList.remove('hidden');
            
            // Start WPM animation
            setTimeout(() => {
                animateWPMCounter(gameState.wpm);
            }, 200);
            
            // Create floating sparkles for personal best
            if (isPersonalBest) {
                setTimeout(() => {
                    createFloatingSparkles();
                }, 1000);
                
                // Update personal best
                gameState.personalBest = gameState.wpm;
            }
        }

        // Reset statistics
        function resetStats() {
            gameState.currentWordIndex = 0;
            gameState.currentCharIndex = 0;
            gameState.userInput = "";
            gameState.correctChars = 0;
            gameState.incorrectChars = 0;
            gameState.totalChars = 0;
            gameState.streakCount = 0;
            gameState.wpm = 0;
            gameState.accuracy = 100;
            gameState.timeLeft = gameState.currentMode;
            gameState.isActive = false;
            
            elements.wpmDisplay.textContent = '0';
            elements.accuracyDisplay.textContent = '100';
            elements.timerDisplay.textContent = gameState.currentMode;
            elements.instructions.style.display = 'block';
            elements.mainContainer.classList.remove('focus-mode');
        }

        // Update live statistics
        function updateStats() {
            if (!gameState.isActive) return;
            
            const timeElapsed = (Date.now() - gameState.startTime) / 1000 / 60;
            if (timeElapsed > 0) {
                const wordsTyped = gameState.correctChars / 5;
                gameState.wpm = Math.round(wordsTyped / timeElapsed);
                elements.wpmDisplay.textContent = gameState.wpm;
            }
            
            if (gameState.totalChars > 0) {
                gameState.accuracy = Math.round((gameState.correctChars / gameState.totalChars) * 100);
                elements.accuracyDisplay.textContent = gameState.accuracy;
            }
        }

        // Handle typing input
        function handleTyping(event) {
            if (!gameState.isActive && event.key !== ' ') {
                startTest();
            }
            
            if (!gameState.isActive) return;
            
            const currentWord = gameState.words[gameState.currentWordIndex];
            
            if (event.key === ' ') {
                event.preventDefault();
                
                // Move to next word
                if (gameState.userInput.length > 0) {
                    // Check word accuracy
                    for (let i = 0; i < Math.max(gameState.userInput.length, currentWord.length); i++) {
                        gameState.totalChars++;
                        if (i < gameState.userInput.length && i < currentWord.length && 
                            gameState.userInput[i] === currentWord[i]) {
                            gameState.correctChars++;
                            gameState.streakCount++;
                            
                            // Check for streak milestone
                            if (gameState.streakCount === 30) {
                                showStreakIndicator();
                            }
                        } else {
                            gameState.incorrectChars++;
                            gameState.streakCount = 0;
                        }
                    }
                    
                    gameState.currentWordIndex++;
                    gameState.userInput = "";
                    renderText();
                    updateStats();
                }
                
            } else if (event.key === 'Backspace') {
                event.preventDefault();
                gameState.userInput = gameState.userInput.slice(0, -1);
                renderText();
                
            } else if (event.key.length === 1) {
                event.preventDefault();
                gameState.userInput += event.key;
                renderText();
            }
        }

        // Show streak indicator
        function showStreakIndicator() {
            const activeWord = document.querySelector('.word-active');
            if (activeWord) {
                activeWord.classList.add('streak-indicator');
                setTimeout(() => {
                    activeWord.classList.remove('streak-indicator');
                }, 500);
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Prevent default navigation
            const links = document.querySelectorAll('a[href^="#"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Navigation to:', this.getAttribute('href'));
                });
            });

            // Typing input
            document.addEventListener('keydown', handleTyping);
            
            // Click to focus
            elements.textDisplay.addEventListener('click', () => {
                elements.typingInput.focus();
                if (!gameState.isActive) {
                    startTest();
                }
            });
            
            // Mode selection
            elements.modeButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const time = parseInt(button.getAttribute('data-time'));
                    gameState.currentMode = time;
                    
                    // Update button states
                    elements.modeButtons.forEach(btn => {
                        btn.classList.remove('border-neon-teal', 'bg-neon-teal', 'bg-opacity-10', 'text-neon-teal');
                        btn.classList.add('border-gray-600');
                    });
                    
                    button.classList.remove('border-gray-600');
                    button.classList.add('border-neon-teal', 'bg-neon-teal', 'bg-opacity-10', 'text-neon-teal');
                    
                    resetGame();
                });
            });
            
            // Enhanced results buttons
            document.getElementById('run-again-btn').addEventListener('click', () => {
                elements.resultsOverlay.classList.add('hidden');
                // Clear sparkles
                document.getElementById('sparkles-container').innerHTML = '';
                document.getElementById('personal-best-badge').classList.add('hidden');
                resetGame();
            });
            
            document.getElementById('view-detailed-results-btn').addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Viewing detailed results...');
            });
        }

        // Reset game
        function resetGame() {
            generateWords();
            renderText();
            resetStats();
        }

        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', initializeGame);
    </script>

</body></html>
